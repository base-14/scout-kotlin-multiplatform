org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true
android.nonTransitiveRClass=true

# The published scout-core version that scout-android / scout-ios / scout-kmp pin to on release
# (with -Prelease). Bump this only when scout-core itself is re-published. Local builds ignore it
# and use project(":scout-core") so source changes flow through immediately.
scout.coreVersion=0.1.1
