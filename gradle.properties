org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true
android.nonTransitiveRClass=true

# Published versions that release builds (-Prelease) pin to instead of project(...) deps, so each
# SDK publishes only itself. Bump a line only when that module is re-published. Local builds ignore
# these and use project(...) so source changes flow through immediately.
#   coreVersion    -> scout-android / scout-ios / scout-kmp pin scout-core
#   androidVersion -> scout-kmp pins scout-android
#   iosVersion     -> scout-kmp pins scout-ios
scout.coreVersion=0.1.7
scout.androidVersion=0.1.7
scout.iosVersion=0.1.9
kotlin.mpp.enableCInteropCommonization=true
