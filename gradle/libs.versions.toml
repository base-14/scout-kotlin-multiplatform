[versions]
# Pinned to match the broad Android consumer ecosystem (Gradle 8.11 / AGP 8.7 / Kotlin 2.1),
# so the published SDK is consumable by stock apps (e.g. architecture-samples) and composite builds.
kotlin = "2.1.10"
agp = "8.7.3"
otelKotlin = "0.4.0"
# Pinned to a Kotlin 2.1-era set so the published SDK is consumable by Kotlin 2.1+ apps
# (ktor 3.5/serialization 1.11 force a Kotlin 2.3 stdlib floor; 3.2.3/1.8.0 stay on 2.1).
coroutines = "1.10.1"
serialization = "1.8.0"
ktor = "3.2.3"
okio = "3.10.2"
okhttp = "4.12.0"

androidxCore = "1.13.1"
lifecycle = "2.8.7"
navigationCompose = "2.8.5"
jankstats = "1.0.0-beta01"
annotation = "1.9.1"
activityCompose = "1.9.3"
composeBom = "2024.12.01"

compileSdk = "35"
minSdk = "24"
targetSdk = "35"

[libraries]
otel-api = { module = "io.opentelemetry.kotlin:api", version.ref = "otelKotlin" }
otel-sdk-api = { module = "io.opentelemetry.kotlin:sdk-api", version.ref = "otelKotlin" }
otel-sdk-common = { module = "io.opentelemetry.kotlin:sdk-common", version.ref = "otelKotlin" }
otel-implementation = { module = "io.opentelemetry.kotlin:implementation", version.ref = "otelKotlin" }
otel-core = { module = "io.opentelemetry.kotlin:core", version.ref = "otelKotlin" }
otel-exporters-core = { module = "io.opentelemetry.kotlin:exporters-core", version.ref = "otelKotlin" }
otel-exporters-persistence = { module = "io.opentelemetry.kotlin:exporters-persistence", version.ref = "otelKotlin" }
otel-semconv = { module = "io.opentelemetry.kotlin:semconv", version.ref = "otelKotlin" }

kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-common = { module = "androidx.lifecycle:lifecycle-common", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-jankstats = { module = "androidx.metrics:metrics-performance", version.ref = "jankstats" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
