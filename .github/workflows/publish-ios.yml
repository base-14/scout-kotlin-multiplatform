name: Publish iOS

# Push a build tag `ios-build-<version>` (e.g. ios-build-0.1.5) to release the iOS SDK two ways:
#   1. Swift/SPM: builds Scout.xcframework, pins root Package.swift to its checksum, commits that to
#      main, then CREATES the consumer tag `ios-<version>` fresh at the checksum commit and attaches
#      the xcframework to a GitHub Release. Swift consumers pin
#      github.com/base-14/scout-kotlin-multiplatform  at the `ios-<version>` tag.
#   2. KMP/Gradle: publishes the io.base14:scout-ios klib to Maven Central so scout-kmp can pin to it.
#
# Why a separate build tag: a repo ruleset forbids UPDATING existing tags. The old design force-moved
# `ios-<version>` onto the checksum commit, which the ruleset now blocks. Instead we trigger on
# `ios-build-<version>` and CREATE `ios-<version>` once, fresh (creation is allowed) — never an update.
#
# -Prelease pins scout-core to the published version (gradle.properties scout.coreVersion) instead of
# the local project, so this release re-publishes nothing but scout-ios. The Maven publish runs LAST
# (it is irreversible) — if any earlier step fails, no Maven version is burned.
# Runs on macOS (Kotlin/Native). Secrets: MAVEN_CENTRAL_PUBLISH_USERNAME/PASSWORD, GPG_SIGNING_KEY/PASSWORD.
on:
  push:
    tags:
      - 'ios-build-[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Derive release version + consumer tag (strip ios-build- prefix)
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#ios-build-}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=ios-${GITHUB_REF_NAME#ios-build-}" >> "$GITHUB_ENV"

      - name: Build xcframework (pins scout-core)
        run: ./gradlew :scout-ios:assembleScoutReleaseXCFramework -Pscout.enableIos=true -Prelease -PreleaseVersion="$RELEASE_VERSION"

      - name: Zip xcframework + compute SPM checksum
        id: xcf
        run: |
          cd scout-ios/build/XCFrameworks/release
          zip -r -q Scout.xcframework.zip Scout.xcframework
          echo "checksum=$(shasum -a 256 Scout.xcframework.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "zip=scout-ios/build/XCFrameworks/release/Scout.xcframework.zip" >> "$GITHUB_OUTPUT"

      - name: Pin Package.swift to the released xcframework, commit, and create the consumer tag
        run: |
          URL="https://github.com/base-14/scout-kotlin-multiplatform/releases/download/${RELEASE_TAG}/Scout.xcframework.zip"
          CHECKSUM="${{ steps.xcf.outputs.checksum }}"
          sed -i '' -E "s#url: \"https://github.com/base-14/scout-kotlin-multiplatform/releases/download/[^\"]+\"#url: \"$URL\"#" Package.swift
          sed -i '' -E "s#checksum: \"[a-f0-9]+\"#checksum: \"$CHECKSUM\"#" Package.swift
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "release ${RELEASE_TAG}: pin xcframework checksum" || echo "no change"
          git push origin HEAD:main
          # Create the consumer tag fresh at the checksum commit (never an update — the ruleset forbids updates).
          git tag "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      - name: Create GitHub Release + upload xcframework
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${{ steps.xcf.outputs.zip }}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${{ steps.xcf.outputs.zip }}" --generate-notes
          fi

      # LAST + irreversible: publish the Kotlin/Native klib to Maven Central for KMP consumers.
      - name: Publish scout-ios klib to Maven Central (pins scout-core)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_PUBLISH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PUBLISH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: >-
          ./gradlew :scout-ios:publishAndReleaseToMavenCentral
          -Pscout.enableIos=true -Prelease -PreleaseVersion="$RELEASE_VERSION" --no-configuration-cache
