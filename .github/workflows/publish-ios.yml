name: Publish iOS

# Run this workflow manually (Actions tab -> "Publish iOS" -> Run workflow, or `gh workflow run`) with
# the version, e.g. 0.1.5. It releases the iOS SDK two ways:
#   1. Swift/SPM: builds Scout.xcframework, pins root Package.swift to its checksum, commits that to
#      main. The bot NEVER creates or moves a git tag (an org ruleset restricts tag creation/updates
#      to bypass actors). Instead it uploads the xcframework zip as a run artifact and prints the one
#      `gh release create` command for a human (who bypasses the ruleset) to run — that command creates
#      the `ios-<version>` tag + GitHub Release at the checksum commit in a single, non-force step.
#      This is the standard "create the version tag last, once" pattern (never force-move a tag).
#   2. KMP/Gradle: publishes the io.base14:scout-ios klib to Maven Central so scout-kmp can pin to it.
#
# -Prelease pins scout-core to the published version (gradle.properties scout.coreVersion). The Maven
# publish runs LAST (irreversible) — if any earlier step fails, no Maven version is burned.
# Runs on macOS (Kotlin/Native). Secrets: MAVEN_CENTRAL_PUBLISH_USERNAME/PASSWORD, GPG_SIGNING_KEY/PASSWORD.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'iOS release version (no prefix), e.g. 0.1.5'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Derive version + consumer tag
        run: |
          echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=ios-${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Build xcframework (pins scout-core)
        run: ./gradlew :scout-ios:assembleScoutReleaseXCFramework -Pscout.enableIos=true -Prelease -PreleaseVersion="$RELEASE_VERSION"

      - name: Zip xcframework + compute SPM checksum
        id: xcf
        run: |
          cd scout-ios/build/XCFrameworks/release
          zip -r -q Scout.xcframework.zip Scout.xcframework
          echo "checksum=$(shasum -a 256 Scout.xcframework.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Pin Package.swift checksum and commit to main (no tag — bot cannot tag)
        id: pin
        run: |
          URL="https://github.com/base-14/scout-kotlin-multiplatform/releases/download/${RELEASE_TAG}/Scout.xcframework.zip"
          CHECKSUM="${{ steps.xcf.outputs.checksum }}"
          sed -i '' -E "s#url: \"https://github.com/base-14/scout-kotlin-multiplatform/releases/download/[^\"]+\"#url: \"$URL\"#" Package.swift
          sed -i '' -E "s#checksum: \"[a-f0-9]+\"#checksum: \"$CHECKSUM\"#" Package.swift
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "release ${RELEASE_TAG}: pin xcframework checksum" || echo "no change to commit"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload xcframework zip (for the human release step)
        uses: actions/upload-artifact@v4
        with:
          name: scout-ios-xcframework
          path: scout-ios/build/XCFrameworks/release/Scout.xcframework.zip
          if-no-files-found: error

      # LAST + irreversible: publish the Kotlin/Native klib to Maven Central for KMP consumers.
      - name: Publish scout-ios klib to Maven Central (pins scout-core)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_PUBLISH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PUBLISH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: >-
          ./gradlew :scout-ios:publishAndReleaseToMavenCentral
          -Pscout.enableIos=true -Prelease -PreleaseVersion="$RELEASE_VERSION" --no-configuration-cache

      - name: Final step for a human (create the tag + Release — you bypass the tag ruleset)
        if: always()
        run: |
          {
            echo "## iOS ${RELEASE_VERSION}: run these two commands locally to finish"
            echo ""
            echo "The checksum is committed to main (\`${{ steps.pin.outputs.sha }}\`) and scout-ios is on Maven Central."
            echo "The only thing left is the tag + GitHub Release, which the bot can't create — so you do it in one non-force command:"
            echo ""
            echo '```bash'
            echo "gh run download ${{ github.run_id }} --repo base-14/scout-kotlin-multiplatform -n scout-ios-xcframework -D ."
            echo "gh release create ${RELEASE_TAG} Scout.xcframework.zip \\"
            echo "  --repo base-14/scout-kotlin-multiplatform \\"
            echo "  --target ${{ steps.pin.outputs.sha }} --generate-notes"
            echo '```'
            echo ""
            echo "That creates the \`${RELEASE_TAG}\` tag + Release at the checksum commit and uploads the xcframework."
            echo "(Only proceed if the Maven publish step above is green.)"
          } >> "$GITHUB_STEP_SUMMARY"
