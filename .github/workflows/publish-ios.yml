name: Publish iOS

# Fully automated — ZERO manual steps. Run: Actions -> "Publish iOS" -> Run workflow (or
# `gh workflow run publish-ios.yml -f version=0.1.7`). It does everything:
#   1. builds Scout.xcframework, pins root Package.swift to its checksum, commits to main
#   2. publishes the io.base14:scout-ios klib to Maven Central (pins scout-core)
#   3. creates the ios-<version> tag + GitHub Release and uploads the xcframework
#
# Why RELEASE_PAT: the org tag ruleset lets only bypass actors create/move tags — the default
# github-actions bot CANNOT create a tag, but a PAT created by a user who bypasses the ruleset can.
# So all git pushes + the release are authenticated with secret RELEASE_PAT (fine-grained PAT,
# Contents: read+write). The GitHub Release asset is the EXACT zip built + checksummed in this run,
# so it always matches the pinned checksum (immutable releases can't be fixed after the fact, so the
# asset must be right the first time — this guarantees it).
#
# Maven runs BEFORE the tag/Release: a Maven failure (the historically flaky step) then burns nothing
# on the SPM side, and main simply re-pins on the next run.
# Runs on macOS (Kotlin/Native). Secrets: RELEASE_PAT, MAVEN_CENTRAL_PUBLISH_USERNAME/PASSWORD, GPG_SIGNING_KEY/PASSWORD.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'iOS release version (no prefix), e.g. 0.1.7'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Derive version + consumer tag
        run: |
          echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=ios-${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Build xcframework (pins scout-core)
        run: ./gradlew :scout-ios:assembleScoutReleaseXCFramework -Pscout.enableIos=true -Prelease -PreleaseVersion="$RELEASE_VERSION"

      - name: Zip xcframework + compute SPM checksum
        id: xcf
        run: |
          cd scout-ios/build/XCFrameworks/release
          zip -r -q Scout.xcframework.zip Scout.xcframework
          echo "checksum=$(shasum -a 256 Scout.xcframework.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Pin Package.swift checksum and commit to main
        run: |
          URL="https://github.com/base-14/scout-kotlin-multiplatform/releases/download/${RELEASE_TAG}/Scout.xcframework.zip"
          CHECKSUM="${{ steps.xcf.outputs.checksum }}"
          sed -i '' -E "s#url: \"https://github.com/base-14/scout-kotlin-multiplatform/releases/download/[^\"]+\"#url: \"$URL\"#" Package.swift
          sed -i '' -E "s#checksum: \"[a-f0-9]+\"#checksum: \"$CHECKSUM\"#" Package.swift
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "release ${RELEASE_TAG}: pin xcframework checksum" || echo "no change"
          git push origin HEAD:main

      # Irreversible #1 (flaky-prone): Maven. Runs first so a failure here burns nothing on the SPM side.
      - name: Publish scout-ios klib to Maven Central (pins scout-core)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_PUBLISH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PUBLISH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: >-
          ./gradlew :scout-ios:publishAndReleaseToMavenCentral
          -Pscout.enableIos=true -Prelease -PreleaseVersion="$RELEASE_VERSION" --no-configuration-cache

      # Irreversible #2: create the tag (RELEASE_PAT bypasses the ruleset) at the checksum commit.
      - name: Create the ios-<version> tag at the checksum commit
        run: |
          git tag "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      # Attach the EXACT built zip to the Release on the tag that now exists (no ref creation here).
      - name: Create GitHub Release + upload the exact built xcframework
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh release create "${RELEASE_TAG}" \
            scout-ios/build/XCFrameworks/release/Scout.xcframework.zip \
            --repo base-14/scout-kotlin-multiplatform --generate-notes
