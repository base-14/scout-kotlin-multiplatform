name: Publish iOS

# Tag `ios-<version>` (e.g. ios-0.1.1) to release the iOS SDK two ways:
#   1. Swift/SPM: builds Scout.xcframework, attaches it to the GitHub Release, pins root Package.swift.
#      Swift consumers add  github.com/base-14/scout-kotlin-multiplatform  at the `ios-<version>` tag.
#   2. KMP/Gradle: publishes the io.base14:scout-ios klib to Maven Central so scout-kmp can pin to it.
# The `ios-` prefix is stripped for the version.
#
# -Prelease pins scout-core to the published version (gradle.properties scout.coreVersion) instead of
# the local project, so this release re-publishes nothing but scout-ios. The Maven publish runs LAST
# (it is irreversible) — if any earlier step fails, no Maven version is burned.
# Runs on macOS (Kotlin/Native). Secrets: MAVEN_CENTRAL_PUBLISH_USERNAME/PASSWORD, GPG_SIGNING_KEY/PASSWORD.
on:
  push:
    tags:
      - 'ios-[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Derive release version (strip ios- prefix)
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#ios-}" >> "$GITHUB_ENV"

      - name: Build xcframework (pins scout-core)
        run: ./gradlew :scout-ios:assembleScoutReleaseXCFramework -Pscout.enableIos=true -Prelease -PreleaseVersion="$RELEASE_VERSION"

      - name: Zip xcframework + compute SPM checksum
        id: xcf
        run: |
          cd scout-ios/build/XCFrameworks/release
          zip -r -q Scout.xcframework.zip Scout.xcframework
          echo "checksum=$(shasum -a 256 Scout.xcframework.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "zip=scout-ios/build/XCFrameworks/release/Scout.xcframework.zip" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release + upload xcframework
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${{ steps.xcf.outputs.zip }}" --generate-notes

      - name: Pin Package.swift to the released xcframework and move the tag
        run: |
          URL="https://github.com/base-14/scout-kotlin-multiplatform/releases/download/${GITHUB_REF_NAME}/Scout.xcframework.zip"
          CHECKSUM="${{ steps.xcf.outputs.checksum }}"
          sed -i '' -E "s#url: \"https://github.com/base-14/scout-kotlin-multiplatform/releases/download/[^\"]+\"#url: \"$URL\"#" Package.swift
          sed -i '' -E "s#checksum: \"[a-f0-9]+\"#checksum: \"$CHECKSUM\"#" Package.swift
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "release ${GITHUB_REF_NAME}: pin xcframework checksum" || echo "no change"
          git push origin HEAD:main
          # Re-point the tag at the commit carrying the correct checksum so SPM consumers match.
          git tag -f "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}" --force

      # LAST + irreversible: publish the Kotlin/Native klib to Maven Central for KMP consumers.
      - name: Publish scout-ios klib to Maven Central (pins scout-core)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_PUBLISH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PUBLISH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: >-
          ./gradlew :scout-ios:publishAndReleaseToMavenCentral
          -Pscout.enableIos=true -Prelease -PreleaseVersion="$RELEASE_VERSION" --no-configuration-cache
