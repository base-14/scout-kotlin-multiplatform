name: Publish KMP

# Tag `kmp-<version>` (e.g. kmp-0.1.1) to publish the unified KMP entry point to Maven Central
# (for KMP apps consuming Scout via Gradle). The `kmp-` prefix is stripped.
#   io.base14:scout-kmp  (pins scout-core / scout-android / scout-ios — does NOT re-publish them)
#
# -Prelease makes scout-kmp depend on the published sibling versions (gradle.properties) instead of
# the local projects, so this release publishes nothing but scout-kmp itself.
# Runs on macOS: the iOS Kotlin/Native klibs can only be built there.
# Secrets: MAVEN_CENTRAL_PUBLISH_USERNAME/PASSWORD, GPG_SIGNING_KEY/PASSWORD
on:
  push:
    tags:
      - 'kmp-[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake (scout-android native crash handler)
        run: sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Derive release version (strip kmp- prefix)
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#kmp-}" >> "$GITHUB_ENV"

      - name: Run CI (make ci)
        run: make ci

      - name: Publish scout-kmp to Maven Central (pins core/android/ios)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_PUBLISH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PUBLISH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: >-
          ./gradlew :scout-kmp:publishAndReleaseToMavenCentral
          -Pscout.enableIos=true -Prelease -PreleaseVersion="$RELEASE_VERSION" --no-configuration-cache
