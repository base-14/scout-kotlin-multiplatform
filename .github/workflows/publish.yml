name: Publish

# Tag a release commit as v<version> (matching the project version) to publish the Android SDK to
# Maven Central (Sonatype Central Portal):
#   io.base14:scout-android   (+ its dependency io.base14:scout-core)
# scout-kmp / scout-ios are NOT published yet (local-only).
#
# Required secrets (org- or repo-level):
#   MAVEN_CENTRAL_PUBLISH_USERNAME, MAVEN_CENTRAL_PUBLISH_PASSWORD  (Sonatype Central Portal token)
#   GPG_SIGNING_KEY (ASCII-armored GPG private key), GPG_SIGNING_PASSWORD
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake (scout-android native crash handler)
        run: sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Verify tag matches project version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="v$(grep -E '^\s*version = ' build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match project version $VERSION"; exit 1
          fi

      # Gate: format check + lint + tests + build. If this fails, the job stops here and nothing publishes.
      - name: Run CI (make ci)
        run: make ci

      - name: Publish scout-android (+ scout-core) to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_PUBLISH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PUBLISH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: ./gradlew :scout-core:publishAndReleaseToMavenCentral :scout-android:publishAndReleaseToMavenCentral --no-configuration-cache
