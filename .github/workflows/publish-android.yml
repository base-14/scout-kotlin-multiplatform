name: Publish Android

# Tag `android-<version>` (e.g. android-0.1.1) to publish the Android SDK to Maven Central.
# The `android-` prefix is stripped -> published version is <version>.
#   io.base14:scout-android   (pins io.base14:scout-core:<scout.coreVersion> — does NOT re-publish core)
#
# -Prelease makes scout-android depend on the published scout-core (gradle.properties scout.coreVersion)
# instead of the local project, so this release re-publishes nothing but scout-android itself.
# Secrets (org- or repo-level): MAVEN_CENTRAL_PUBLISH_USERNAME, MAVEN_CENTRAL_PUBLISH_PASSWORD,
#   GPG_SIGNING_KEY, GPG_SIGNING_PASSWORD
on:
  push:
    tags:
      - 'android-[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake (scout-android native crash handler)
        run: sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Derive release version (strip android- prefix)
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#android-}" >> "$GITHUB_ENV"

      # Gate: format check + lint + tests + build. Nothing publishes if this fails.
      - name: Run CI (make ci)
        run: make ci

      - name: Publish scout-android to Maven Central (pins scout-core)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_PUBLISH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PUBLISH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: >-
          ./gradlew :scout-android:publishAndReleaseToMavenCentral
          -Prelease -PreleaseVersion="$RELEASE_VERSION" --no-configuration-cache
